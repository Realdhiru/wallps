name: Update Wallpaper Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'dark/**'
      - 'blue/**'
      - 'warm/**'
      - 'purple/**'
      - 'green/**'
      - 'light/**'
      - 'gifs/**'
      - 'videos/**'

permissions:
  contents: write

jobs:
  generate-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ImageMagick & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg webp

      - name: Generate Previews & Update README
        run: |
          python3 scripts/generate_gallery.py .

      - name: Commit & Push Previews and README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previews/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-generate wallpaper previews and update gallery [skip ci]"
            git push
          fi
